<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0B0E">
<title>Marble Run Builder</title>
<link rel="preload" href="fonts/mona-sans-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Icons: 24-unit strokes in currentColor, used as <svg class="icon"><use href="#i-..."/></svg> -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9.5h11V10"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 5 4 10l5 5"/><path d="M4 10h9.5a5.5 5.5 0 0 1 0 11H10"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 5 5 5-5 5"/><path d="M20 10h-9.5a5.5 5.5 0 0 0 0 11H14"/></symbol>
    <symbol id="i-marbles-off" viewBox="0 0 24 24"><circle cx="10" cy="14" r="6"/><path d="m15.5 4 5 5m0-5-5 5"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M5.5 13a7 7 0 1 0 2-5.6"/><path d="M5 4v4.5h4.5"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4m-4 4 4-4 4 4"/><path d="M6 12v7.5h12V12"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2 1-1.2 1.8v.6"/><path d="M12 17.2v.1"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="m6.5 7 1 13h9l1-13"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 6.5h6l2 2.5h9v10.5h-17z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5.5v13M15 5.5v13"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h4l5-4v13l-5-4H4z"/><path d="M16.5 9a4.5 4.5 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></symbol>
    <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M4 9.5h4l5-4v13l-5-4H4z"/><path d="m16.5 9.5 5 5m0-5-5 5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-mirror" viewBox="0 0 24 24"><path d="M4 8h14m-3.5-3.5L18 8l-3.5 3.5M20 16H6m3.5-3.5L6 16l3.5 3.5"/></symbol>
    <symbol id="i-rename" viewBox="0 0 24 24"><path d="m5 19 1-4 9.5-9.5a2.1 2.1 0 0 1 3 3L9 18z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/></symbol>
    <symbol id="i-save-here" viewBox="0 0 24 24"><path d="M12 4v10m-4-4 4 4 4-4"/><path d="M5 15v4.5h14V15"/></symbol>
    <symbol id="i-track" viewBox="0 0 24 24"><path d="m4 8 16 9"/></symbol>
    <symbol id="i-curves" viewBox="0 0 24 24"><path d="M5 5.5a13 13 0 0 0 13 13"/></symbol>
    <symbol id="i-movers" viewBox="0 0 24 24"><path d="m6 7 5 5-5 5M13 7l5 5-5 5"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-gadgets" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-blocks" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></symbol>
  </svg>

  <div id="game">
    <canvas id="playfield" aria-label="The marble run board"></canvas>
    <div id="toolbar" role="toolbar" aria-label="Game controls">
      <button id="btn-home" class="ghost" aria-label="Pick a track" title="Pick a track"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg></button>
      <span class="gap"></span>
      <button id="btn-undo" class="ghost" aria-label="Undo" title="Undo"><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg></button>
      <button id="btn-redo" class="ghost" aria-label="Redo" title="Redo"><svg class="icon" aria-hidden="true"><use href="#i-redo"/></svg></button>
      <span class="gap"></span>
      <button id="btn-marble" aria-label="Drop a marble" title="Drop a marble">
        <svg class="marble-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle class="glint" cx="9" cy="9" r="2.4"/></svg>
        <span class="pill-label">Drop marble</span>
        <span class="count" id="marble-count" aria-hidden="true">0</span>
      </button>
      <span class="gap"></span>
      <button id="btn-restart" class="ghost" aria-label="Restart the run" title="Restart the run"><svg class="icon" aria-hidden="true"><use href="#i-restart"/></svg></button>
      <button id="btn-reset" class="ghost" aria-label="Clear the marbles" title="Clear the marbles"><svg class="icon" aria-hidden="true"><use href="#i-marbles-off"/></svg></button>
      <button id="btn-clear" class="ghost" aria-label="Clear the board" title="Clear the board"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg></button>
      <span class="gap"></span>
      <button id="btn-save" class="ghost" aria-label="My runs: save and open" title="My runs"><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg></button>
      <button id="btn-pause" class="ghost" aria-label="Pause" aria-pressed="false" title="Pause"><svg class="icon" aria-hidden="true"><use href="#i-pause"/></svg></button>
      <button id="btn-mute" class="ghost" aria-label="Sound" aria-pressed="true" title="Sound on or off"><svg class="icon" aria-hidden="true"><use href="#i-sound"/></svg></button>
    </div>
    <div id="tray">
      <div id="tray-groups" role="group" aria-label="Kinds of piece"></div>
      <div id="tray-items" role="group" aria-label="Pieces: drag one onto the board"></div>
      <div id="tray-trash" aria-hidden="true"><svg class="icon"><use href="#i-trash"/></svg><span>Drop here to remove</span></div>
    </div>
    <div id="save-dialog" class="dialog hidden" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <div class="dialog-card">
        <div class="dialog-head">
          <h2 id="dlg-title">My marble runs</h2>
          <button id="dlg-share" class="share-pill" title="Share this board as a link"><svg class="icon" aria-hidden="true"><use href="#i-share"/></svg><span class="label">Share this board</span></button>
          <button id="dlg-close" class="ghost" aria-label="Close" title="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
        </div>
        <div id="slot-grid"></div>
      </div>
    </div>
    <div id="coach" class="hidden" role="status" aria-live="polite">
      <div id="coach-dots" aria-hidden="true"></div>
      <p id="coach-text"></p>
      <div class="coach-buttons">
        <button id="coach-next" class="label">Next</button>
        <button id="coach-skip" class="label">Skip tips</button>
      </div>
    </div>
    <div id="toast" class="hidden" role="status" aria-live="polite"></div>
  </div>

  <div id="splash" class="hidden" role="dialog" aria-modal="true" aria-labelledby="splash-title">
    <div class="splash-stage" id="splash-stage">
      <canvas id="splash-toy" aria-hidden="true"></canvas>
      <button id="splash-close" class="ghost hidden" aria-label="Back to the board" title="Back to the board"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      <div class="splash-copy">
        <h1 class="splash-title" id="splash-title" data-glyphs>MARBLE RUN BUILDER</h1>
        <p class="splash-sub" data-solid-box>Pick a track to play, or start your own.</p>
      </div>
      <div id="splash-grid"></div>
      <div class="splash-foot">
        <button id="splash-help" class="share-pill" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-help"/></svg><span class="label">How to play</span></button>
        <p class="splash-hint" aria-hidden="true">Grab a shape and throw it.</p>
      </div>
    </div>
  </div>

  <div id="rotate-overlay">
    <div class="rotate-card">
      <svg class="rotate-device" viewBox="0 0 120 120" aria-hidden="true"><rect x="36" y="14" width="48" height="92" rx="7"/><path d="M56 97h8"/></svg>
      <h1>Turn your iPad sideways</h1>
    </div>
  </div>

  <script src="vendor/matter.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
